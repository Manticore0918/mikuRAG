<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
  <title id="title">Retrieval quality and latency trade-off on the gold_v1 diagnostic test split</title>
  <desc id="description">Horizontal bars compare Recall at 10, MRR at 10, and NDCG at 10 for vector, PostgreSQL full text, BM25, hybrid reciprocal-rank fusion, and reranked hybrid retrieval. Latency is listed separately.</desc>
