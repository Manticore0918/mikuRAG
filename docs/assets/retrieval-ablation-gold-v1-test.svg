  <text x="72" y="860" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">Interpretation: BM25 and hybrid retrieval improve this frozen diagnostic corpus; the cross-encoder adds NDCG but dominates latency.</text>
