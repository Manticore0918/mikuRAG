name: Evaluation

# Scheduled/manual full evaluation with real providers. Manual and tag-release
# invocations run in any repository and fail before startup when protected
# configuration is missing. Scheduled runs require an explicit repository
# opt-in, and this workflow is never required for pull-request CI.

on:
  workflow_call:
    inputs:
      max_cases:
        description: "Limit to the first N cases (empty = full dataset)"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded evaluation artifact"
        required: false
        type: string
        default: evaluation-results
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Limit to the first N cases (empty = full dataset)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  full-evaluation:
    name: Full provider-backed evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name != 'schedule' || vars.MIKURAG_SCHEDULED_EVALUATION_ENABLED == 'true'
    environment: evaluation
    env:
      MIKURAG_EMBEDDING_API_KEY: ${{ secrets.MIKURAG_EMBEDDING_API_KEY }}
      MIKURAG_EMBEDDING_ENDPOINT: ${{ vars.MIKURAG_EMBEDDING_ENDPOINT }}
      MIKURAG_EMBEDDING_MODEL_ID: ${{ vars.MIKURAG_EMBEDDING_MODEL_ID }}
      MIKURAG_GENERATION_API_KEY: ${{ secrets.MIKURAG_GENERATION_API_KEY }}
      MIKURAG_GENERATION_BASE_URL: ${{ vars.MIKURAG_GENERATION_BASE_URL }}
      MIKURAG_GENERATION_MODEL_ID: ${{ vars.MIKURAG_GENERATION_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected provider configuration
        run: |
          require() {
            local name="$1"
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          }
          require_https() {
            local name="$1"
            require "$name"
            case "${!name}" in
              https://*) ;;
              *) echo "$name must use https://" >&2; exit 1 ;;
            esac
          }
          require MIKURAG_EMBEDDING_API_KEY
          require_https MIKURAG_EMBEDDING_ENDPOINT
          require MIKURAG_EMBEDDING_MODEL_ID
          require MIKURAG_GENERATION_API_KEY
          require_https MIKURAG_GENERATION_BASE_URL
          require MIKURAG_GENERATION_MODEL_ID
      - name: Prepare .env
        run: |
          cat > .env <<'EOF'
          MIKURAG_ENVIRONMENT=test
          MIKURAG_SESSION_SECRET=eval-session-secret-0123456789abcdef
          MIKURAG_ENCRYPTION_MASTER_KEY=eval-encryption-key-0123456789abcdef
          POSTGRES_PASSWORD=eval-postgres-password
          EOF
      - name: Start infrastructure and migrate
        run: |
          docker compose -p mikurag-eval up -d --wait postgres redis
          docker compose -p mikurag-eval --profile tools build migrate
          docker compose -p mikurag-eval --profile tools run --rm migrate
      - name: Run the full evaluation
        env:
          MAX_CASES: ${{ inputs.max_cases }}
        run: |
          ARGS=()
          if [ -n "$MAX_CASES" ]; then
            ARGS=(--max-cases "$MAX_CASES")
          fi
          docker compose -p mikurag-eval --profile tools run --rm \
            evaluate python -m app.evaluation_cli run --answers "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'evaluation-results' }}
          path: backend/evaluation/results/
          retention-days: 90
      - name: Tear down
        if: always()
        run: docker compose -p mikurag-eval down -v --remove-orphans
