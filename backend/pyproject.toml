[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mikurag-backend"
version = "0.1.0"
description = "mikuRAG API and background worker"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1,<25",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=5.7,<6",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mikurag-backend[otel]",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]
otel = [
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-celery>=0.50b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-redis>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
  "opentelemetry-sdk>=1.30,<2",
]
rerank = [
  "sentence-transformers==4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -m 'not integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires live PostgreSQL/pg_search and Redis (deselect by default; run with -m integration)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Test-run debris from `pytest --basetemp` invocations; gitignored but present
# on development trees, and intentionally malformed fixtures break parsing.
extend-exclude = [".pytest-tmp", ".pytest-tmp-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
