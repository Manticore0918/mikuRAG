name: mikurag

x-backend-environment: &backend-environment
  MIKURAG_ENVIRONMENT: ${MIKURAG_ENVIRONMENT:-development}
  MIKURAG_DATABASE_URL: ${MIKURAG_DATABASE_URL:-postgresql+asyncpg://mikurag:mikurag@postgres:5432/mikurag}
  MIKURAG_REDIS_URL: ${MIKURAG_REDIS_URL:-redis://redis:6379/0}
  MIKURAG_UPLOAD_DIR: ${MIKURAG_UPLOAD_DIR:-/data/uploads}
  MIKURAG_SESSION_SECRET: ${MIKURAG_SESSION_SECRET:?Set MIKURAG_SESSION_SECRET in .env}
  MIKURAG_ENCRYPTION_MASTER_KEY: ${MIKURAG_ENCRYPTION_MASTER_KEY:?Set MIKURAG_ENCRYPTION_MASTER_KEY in .env}
  MIKURAG_CORS_ORIGINS: ${MIKURAG_CORS_ORIGINS:-["http://localhost:5173"]}
  MIKURAG_MAX_UPLOAD_BYTES: ${MIKURAG_MAX_UPLOAD_BYTES:-52428800}
  MIKURAG_UPLOAD_PART_BYTES: ${MIKURAG_UPLOAD_PART_BYTES:-5242880}
  MIKURAG_UPLOAD_SESSION_TTL_SECONDS: ${MIKURAG_UPLOAD_SESSION_TTL_SECONDS:-86400}
  MIKURAG_MAX_ACTIVE_UPLOAD_SESSIONS: ${MIKURAG_MAX_ACTIVE_UPLOAD_SESSIONS:-20}
  MIKURAG_MAX_DOCUMENT_PAGES: ${MIKURAG_MAX_DOCUMENT_PAGES:-500}
  MIKURAG_CHUNKING_VERSION: ${MIKURAG_CHUNKING_VERSION:-legacy}
  MIKURAG_CHUNK_TOKENIZER: ${MIKURAG_CHUNK_TOKENIZER:-conservative_v1}
  MIKURAG_CHUNK_TARGET_CHARACTERS: ${MIKURAG_CHUNK_TARGET_CHARACTERS:-800}
  MIKURAG_CHUNK_OVERLAP_CHARACTERS: ${MIKURAG_CHUNK_OVERLAP_CHARACTERS:-100}
  MIKURAG_CHILD_MIN_TOKENS: ${MIKURAG_CHILD_MIN_TOKENS:-200}
  MIKURAG_CHILD_TARGET_TOKENS: ${MIKURAG_CHILD_TARGET_TOKENS:-500}
  MIKURAG_CHILD_MAX_TOKENS: ${MIKURAG_CHILD_MAX_TOKENS:-750}
  MIKURAG_CHILD_OVERLAP_TOKENS: ${MIKURAG_CHILD_OVERLAP_TOKENS:-60}
  MIKURAG_PARENT_TARGET_TOKENS: ${MIKURAG_PARENT_TARGET_TOKENS:-2000}
  MIKURAG_PARENT_MAX_TOKENS: ${MIKURAG_PARENT_MAX_TOKENS:-3000}
  MIKURAG_SUMMARY_GENERATION_ENABLED: ${MIKURAG_SUMMARY_GENERATION_ENABLED:-false}
  MIKURAG_SUMMARY_PROMPT_VERSION: ${MIKURAG_SUMMARY_PROMPT_VERSION:-hierarchical_summary_v1}
  MIKURAG_SUMMARY_MAX_TOKENS: ${MIKURAG_SUMMARY_MAX_TOKENS:-600}
  MIKURAG_SUMMARY_REDUCE_BATCH_SIZE: ${MIKURAG_SUMMARY_REDUCE_BATCH_SIZE:-8}
  MIKURAG_SUMMARY_RETRIEVAL_LIMIT: ${MIKURAG_SUMMARY_RETRIEVAL_LIMIT:-8}
  MIKURAG_SUMMARY_CONTEXT_TOKEN_BUDGET: ${MIKURAG_SUMMARY_CONTEXT_TOKEN_BUDGET:-4000}
  MIKURAG_MAX_DOCUMENT_CHUNKS: ${MIKURAG_MAX_DOCUMENT_CHUNKS:-5000}
  MIKURAG_MAX_DOCUMENT_TOKENS: ${MIKURAG_MAX_DOCUMENT_TOKENS:-2000000}
  MIKURAG_HIERARCHICAL_RETRIEVAL_ENABLED: ${MIKURAG_HIERARCHICAL_RETRIEVAL_ENABLED:-false}
  MIKURAG_RETRIEVAL_SEMANTIC_CANDIDATES: ${MIKURAG_RETRIEVAL_SEMANTIC_CANDIDATES:-50}
  MIKURAG_RETRIEVAL_LEXICAL_CANDIDATES: ${MIKURAG_RETRIEVAL_LEXICAL_CANDIDATES:-50}
  MIKURAG_RETRIEVAL_RERANK_CANDIDATES: ${MIKURAG_RETRIEVAL_RERANK_CANDIDATES:-20}
  MIKURAG_RETRIEVAL_EVIDENCE_LIMIT: ${MIKURAG_RETRIEVAL_EVIDENCE_LIMIT:-8}
  MIKURAG_RETRIEVAL_EVIDENCE_TOKEN_BUDGET: ${MIKURAG_RETRIEVAL_EVIDENCE_TOKEN_BUDGET:-6000}
  MIKURAG_RETRIEVAL_MAX_MERGED_PASSAGE_TOKENS: ${MIKURAG_RETRIEVAL_MAX_MERGED_PASSAGE_TOKENS:-1500}
  MIKURAG_RETRIEVAL_NEIGHBOR_EXPANSION_COUNT: ${MIKURAG_RETRIEVAL_NEIGHBOR_EXPANSION_COUNT:-1}
  MIKURAG_RETRIEVAL_DOCUMENT_DIVERSITY_PENALTY: ${MIKURAG_RETRIEVAL_DOCUMENT_DIVERSITY_PENALTY:-0.2}
  MIKURAG_ACCEPTANCE_MIN_QUALITY_IMPROVEMENT: ${MIKURAG_ACCEPTANCE_MIN_QUALITY_IMPROVEMENT:-0.02}
  MIKURAG_ACCEPTANCE_RETRIEVAL_P95_TARGET_MS: ${MIKURAG_ACCEPTANCE_RETRIEVAL_P95_TARGET_MS:-1500}
  MIKURAG_WORKER_MEMORY_LIMIT_BYTES: ${MIKURAG_WORKER_MEMORY_LIMIT_BYTES:-1073741824}
  MIKURAG_REINDEX_MAX_ATTEMPTS: ${MIKURAG_REINDEX_MAX_ATTEMPTS:-3}
  MIKURAG_REINDEX_BATCH_DELAY_SECONDS: ${MIKURAG_REINDEX_BATCH_DELAY_SECONDS:-2}
  MIKURAG_REINDEX_STALE_AFTER_SECONDS: ${MIKURAG_REINDEX_STALE_AFTER_SECONDS:-900}
  MIKURAG_INGESTION_STALE_AFTER_SECONDS: ${MIKURAG_INGESTION_STALE_AFTER_SECONDS:-900}
  MIKURAG_INGESTION_BUSY_RETRY_SECONDS: ${MIKURAG_INGESTION_BUSY_RETRY_SECONDS:-30}
  MIKURAG_EMBEDDING_ENDPOINT: ${MIKURAG_EMBEDDING_ENDPOINT:-https://dashscope.aliyuncs.com/api/v1/services/embeddings/multimodal-embedding/multimodal-embedding}
  MIKURAG_EMBEDDING_MODEL_ID: ${MIKURAG_EMBEDDING_MODEL_ID:-tongyi-embedding-vision-flash-2026-03-06}
  MIKURAG_EMBEDDING_API_KEY: ${MIKURAG_EMBEDDING_API_KEY:-}
  MIKURAG_GENERATION_BASE_URL: ${MIKURAG_GENERATION_BASE_URL:-http://host.docker.internal:11434/v1}
  MIKURAG_GENERATION_MODEL_ID: ${MIKURAG_GENERATION_MODEL_ID:-DeepSeek-R1-Distill-Qwen-7B}
  MIKURAG_GENERATION_API_KEY: ${MIKURAG_GENERATION_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mikurag}
      POSTGRES_USER: ${POSTGRES_USER:-mikurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  evaluate:
    build: ./backend
    command: ["python", "-m", "app.evaluation_cli"]
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads
      - ./backend/evaluation/results:/app/evaluation/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["tools"]

  backend:
    build: ./backend
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./backend
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *backend-environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads:
